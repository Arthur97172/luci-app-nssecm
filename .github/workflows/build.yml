name: Build Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: 语法检查
        run: |
          node --check htdocs/luci-static/resources/view/nssecm.js
          sh -n root/etc/uci-defaults/luci-nssecm

      # menu.d / acl.d 是 JSON 风格 LuCI 应用的骨架：坏一个字符，菜单或 ACL
      # 会静默失效（rpcd 只打日志不报错），所以这里当作语法检查对待。
      - name: 校验 JSON
        run: |
          python3 - <<'PY'
          import json
          for p in ("root/usr/share/luci/menu.d/luci-app-nssecm.json",
                    "root/usr/share/rpcd/acl.d/luci-app-nssecm.json"):
              with open(p, encoding="utf-8") as fh:
                  json.load(fh)
              print("ok", p)
          PY

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: ipk
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: ipk
          - artifact: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            pkg_ext: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: package-dir

      - name: Download SDK
        run: |
          curl -sL --retry 5 --retry-delay 10 "${{ matrix.sdk_url }}" -o sdk.tar.zst

      - name: Extract SDK
        run: |
          tar -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Copy package to SDK
        run: |
          mkdir -p sdk/package/luci-app-nssecm
          cp -r package-dir/* sdk/package/luci-app-nssecm/

      - name: Install feeds
        run: |
          cd sdk
          sed -e 's/^src-git-full /src-git /' feeds.conf.default > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 显式选中中文：i18n 子包的 DEFAULT 是 LUCI_LANG_zh_Hans||(ALL&&m)。
          # 置 y 后该表达式即为 y，与 SDK 是否自带 CONFIG_ALL=y 无关。
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          make defconfig

      - name: Build package
        run: |
          cd sdk
          # 只需目录级目标：luci.mk 的 LuciTranslation 在同一个 Makefile 里求值，
          # i18n 子包与该目录同属一个 builddir，会一并编译。
          # 注意不存在 package/luci-i18n-nssecm-zh-cn/compile 这个目标。
          make -j"$(nproc)" package/luci-app-nssecm/compile V=s

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f -name "luci-*nssecm*.${{ matrix.pkg_ext }}" -exec cp {} artifacts/ \;
          # 不能用 test -s artifacts/*：多个产物时 glob 展开成多参数，test 会报 binary operator expected
          [ -n "$(ls -A artifacts 2>/dev/null)" ] || { echo "No artifact found!"; exit 1; }
          # 翻译包缺失说明 i18n 子包没被编译出来，直接失败以便尽早发现
          ls artifacts/ | grep -q "luci-i18n-nssecm" || { echo "i18n package missing!"; exit 1; }
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: ignore

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read version from Makefile
        id: version
        run: |
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr -d '[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | tr -d '[:space:]')
          PKGVER="${VER}-r${REL}"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "包版本：${PKGVER}"

      - name: Download ipk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ipk
          path: artifacts

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: artifacts

      - name: Verify artifacts
        run: |
          mkdir -p artifacts
          if ! ls artifacts/* 1>/dev/null 2>&1; then
            echo "没有编译产物，终止构建"
            exit 1
          fi
          ls -lh artifacts/

      - name: Delete existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGVER="${{ steps.version.outputs.PKGVER }}"
          gh release delete "$PKGVER" -y --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$PKGVER" 2>/dev/null || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PKGVER }}
          name: ${{ steps.version.outputs.PKGVER }}
          body: |
            自动编译的插件包（版本 ${{ steps.version.outputs.PKGVER }}）

            - `.ipk`（opkg）— OpenWrt/ImmortalWrt 24.10 及更早
            - `.apk`（apk）— OpenWrt/ImmortalWrt 25.12+
            - 架构 `all`：纯 JS 包，同一份产物同时支持 ARM / x86 / MIPS 等所有平台
            - `luci-i18n-nssecm-zh-cn`：中文翻译包，单独安装；不装则界面显示英文
            - 页面需要设备上已装 NSS ECM 引擎（`kmod-qca-nss-ecm-*`，提供
              `/etc/config/ecm`），否则菜单入口不显示
          files: artifacts/*
          token: ${{ github.token }}
          make_latest: true
